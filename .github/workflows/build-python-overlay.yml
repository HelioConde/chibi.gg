name: Build Python Overlay

on:
  push:
    paths:
      - "overlay-python/**"
      - ".github/workflows/build-python-overlay.yml"
  pull_request:
    paths:
      - "overlay-python/**"
      - ".github/workflows/build-python-overlay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: overlay-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test gameflow
        run: python -m pytest tests -q
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --noconsole --name ChibiCompanion app.py
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChibiCompanion-Windows
          path: overlay-python/dist/ChibiCompanion/**
          if-no-files-found: error
