name: Deploy TFT Edge Function

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/public-tft-profile/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy public-tft-profile
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
          supabase functions deploy public-tft-profile \
            --project-ref pbosggnpdzrirjhuswkj \
            --no-verify-jwt
