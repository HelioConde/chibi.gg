name: Check Chibi Companion

on:
  push:
    branches: ["**"]
    paths:
      - "companion/**"
      - ".github/workflows/companion-check.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "companion/**"
      - ".github/workflows/companion-check.yml"
  workflow_dispatch:

concurrency:
  group: "companion-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  frontend:
    name: Companion frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript + Vite build
        run: npm run build

  rust:
    name: Companion Rust
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
