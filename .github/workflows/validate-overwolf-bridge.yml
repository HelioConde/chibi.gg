name: Validate Overwolf Bridge

on:
  push:
    paths:
      - "overwolf-companion/**"
      - ".github/workflows/validate-overwolf-bridge.yml"
  pull_request:
    paths:
      - "overwolf-companion/**"
      - ".github/workflows/validate-overwolf-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overwolf-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overwolf-companion/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
