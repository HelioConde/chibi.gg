name: Visual & responsive QA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "playwright.config.cjs"
      - "tests/e2e/**"
      - ".github/workflows/visual-audit.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project and browser test runner
        run: |
          npm install
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Capture desktop and mobile screenshots
        run: npx playwright test --config=playwright.config.cjs
      - name: Upload screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chibi-responsive-qa
          path: |
            visual-audit/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
