name: Native Companion
on:
  push:
    paths: ["chibi-native-companion/**", ".github/workflows/native-companion.yml"]
  pull_request:
    paths: ["chibi-native-companion/**", ".github/workflows/native-companion.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: chibi-native-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: pytest tests -q
      - run: pyinstaller --noconfirm ChibiNativeCompanion.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Chibi-Native-Companion-Windows
          path: chibi-native-companion/dist/ChibiCompanion
